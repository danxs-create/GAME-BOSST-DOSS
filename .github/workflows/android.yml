name: GAME DOSS - Android Native Build CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build GAME DOSS APKs
    runs-on: ubuntu-latest

    # Set default working directory to our Android Studio project folder
    defaults:
      run:
        working-directory: ./android-native

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Grant execute permission for gradle wrapper (if committed to the repo)
      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not found, generating wrapper using local gradle..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-doss-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-doss-release
          path: android-native/app/build/outputs/apk/release/app-release-unsigned.apk
